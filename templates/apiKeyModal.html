<!-- SUB-MODAL POPUP: CONNECT A REAL SOCIAL MEDIA ACCOUNT VIA OAUTH 2.0 -->
<div id="socialConnectOverlay" class="social-modal-overlay" style="display: none;">
  <div class="social-modal-card">
    <button class="social-modal-close" onclick="window.closeSocialConnectModal()">&times;</button>
    
    <h2 class="social-modal-title">Connect a real social account</h2>
    <p class="social-modal-subtitle">Direct OAuth 2.0 connection to authorize TRENDORA publishing.</p>

    <div class="social-btn-stack">
      <button type="button" class="btn-social-connect btn-twitter" onclick="window.handleSocialPlatformConnect('Twitter')">
        <span class="social-icon">𝕏</span> Authorize with Twitter / X
      </button>

      <button type="button" class="btn-social-connect btn-linkedin" onclick="window.handleSocialPlatformConnect('LinkedIn')">
        <span class="social-icon">in</span> Authorize with LinkedIn
      </button>

      <button type="button" class="btn-social-connect btn-facebook" onclick="window.handleSocialPlatformConnect('Facebook')">
        <span class="social-icon">f</span> Authorize with Facebook
      </button>

      <button type="button" class="btn-social-connect btn-tiktok" onclick="window.handleSocialPlatformConnect('TikTok')">
        <span class="social-icon">🎵</span> Authorize with TikTok
      </button>

      <button type="button" class="btn-social-connect btn-instagram" onclick="window.handleSocialPlatformConnect('Instagram')">
        <span class="social-icon">📷</span> Authorize with Instagram
      </button>

      <button type="button" class="btn-social-connect btn-threads" onclick="window.handleSocialPlatformConnect('Threads')">
        <span class="social-icon">@</span> Authorize with Threads
      </button>

      <button type="button" class="btn-social-connect btn-pinterest" onclick="window.handleSocialPlatformConnect('Pinterest')">
        <span class="social-icon">📌</span> Authorize with Pinterest
      </button>

      <button type="button" class="btn-social-connect btn-bluesky" onclick="window.handleSocialPlatformConnect('Bluesky')">
        <span class="social-icon">🦋</span> Authorize with Bluesky
      </button>

      <button type="button" class="btn-social-connect btn-youtube" onclick="window.handleSocialPlatformConnect('YouTube')">
        <span class="social-icon">▶</span> Authorize with YouTube
      </button>
    </div>

    <div class="social-modal-footer">
      <button type="button" class="link-social-skip" onclick="window.closeSocialConnectModal()">
        Skip for now
      </button>
    </div>

  </div>
</div>

      <p style="font-size: 12px; color: #9ca3af;">TRENDORA Inc. &bull; Terakhir Diperbarui: 30 Juli 2026</p>
    </div>

    <div id="legalModalBody" class="legal-document-body">

    <div style="margin-top: 20px; text-align: right;">
      <button type="button" class="btn-secondary" style="padding: 8px 18px; font-size: 13px;" onclick="window.closeLegalModal()">

      </button>

</div>

<style>

  .cmd { color: #818cf8; }
  .success { color: #34d399; }
  .param { color: #f472b6; }

  .tag-item { background: rgba(255, 255, 255, 0.05); color: #9ca3af; padding: 4px 12px; border-radius: 8px; font-size: 12px; }

  .pricing-header { text-align: center; max-width: 700px; margin: 0 auto 60px auto; }

  .pricing-header h1 { font-size: 48px; font-weight: 800; color: #fff; margin-bottom: 16px; }

  .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(13, 10, 26, 0.88); backdrop-filter: blur(14px); z-index: 9999; display: flex; justify-content: center; align-items: center; padding: 20px; overflow-y: auto; }

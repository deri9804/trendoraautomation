<div class="form-container" style="max-width: 500px; margin: 40px auto; padding: 20px; background: #1e1e1e; border-radius: 8px;">
  <h2>Hubungi Kami / Kirim Pesan</h2>
  <p>Pesan ini akan otomatis dikirim ke workflow n8n milikmu.</p>

  <!-- PENTING: onsubmit="kirimKeN8n(event)" memanggil fungsi di js.html -->
  <form onsubmit="kirimKeN8n(event)" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
    
    <div>
      <label style="color: #ccc; font-size: 14px;">Nama Lengkap</label>
      <input 
        type="text" 
        name="nama" 
        placeholder="Masukkan nama..." 
        required 
        style="width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 6px;"
      />
    </div>

    <div>
      <label style="color: #ccc; font-size: 14px;">Email</label>
      <input 
        type="email" 
        name="email" 
        placeholder="nama@email.com" 
        required 
        style="width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 6px;"
      />
    </div>

    <div>
      <label style="color: #ccc; font-size: 14px;">Pesan</label>
      <textarea 
        name="pesan" 
        rows="4" 
        placeholder="Tulis pesan kamu di sini..." 
        required 
        style="width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 6px;"
      ></textarea>
    </div>

    <button 
      type="submit" 
      style="padding: 12px; background: #e67e22; color: #fff; font-weight: bold; border: none; border-radius: 6px; cursor: pointer;">
      Kirim Pesan ke n8n 🚀
    </button>
  </form>
</div>
